name: Check and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Builds Lua from lua.org so the checks don't depend on the Ubuntu package mirrors. The posix target needs no readline.
      - name: Install Lua 5.1
        run: |
          curl -fsSL --retry 3 https://www.lua.org/ftp/lua-5.1.5.tar.gz -o "$RUNNER_TEMP/lua.tar.gz"
          echo "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  $RUNNER_TEMP/lua.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lua.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.1.5" posix
          sudo make -C "$RUNNER_TEMP/lua-5.1.5" install INSTALL_TOP=/usr/local

      - name: Check release generation
        run: |
          python3 Tests/test-prepare-release.py
          python3 Tests/prepare-release.py --check --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Prepare branch package check
        if: github.ref_type != 'tag'
        run: git tag --points-at HEAD | xargs -r git tag --delete

      - name: Build without publishing
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d

      - name: Check package and synchronized release metadata
        run: python3 Tests/check-package.py .release/Glassy
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Compile addon and run regression tests
        run: |
          find Glassy Tests -name '*.lua' -print0 | xargs -0 -n 1 luac -p
          cp -R .release/Glassy/libs ./libs
          for test in Tests/*.lua; do lua "$test"; done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check publishing credentials are configured
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::Add the CF_API_KEY repository secret before publishing."
            exit 1
          fi
          if [ -z "$WAGO_API_TOKEN" ]; then
            echo "::error::Add the WAGO_API_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Publish to CurseForge, Wago, and GitHub Releases
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
