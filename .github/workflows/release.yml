name: Check and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Prepare branch package check
        if: github.ref_type != 'tag'
        run: git tag --points-at HEAD | xargs -r git tag --delete

      - name: Build without publishing
        uses: BigWigsMods/packager@5abb6e1ddbd98c818ac5ee3692613cd372619dc9 # v2
        with:
          args: -d

      - name: Check package and synchronized release metadata
        run: python3 Tests/check-package.py .release/Glassy
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Compile addon and run regression tests
        run: |
          find Glassy Tests -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
          cp -R .release/Glassy/libs ./libs
          for test in Tests/*.lua; do lua5.1 "$test"; done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check publishing credentials are configured
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::Add the CF_API_KEY repository secret before publishing."
            exit 1
          fi
          if [ -z "$WAGO_API_TOKEN" ]; then
            echo "::error::Add the WAGO_API_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Publish to CurseForge, Wago, and GitHub Releases
        uses: BigWigsMods/packager@5abb6e1ddbd98c818ac5ee3692613cd372619dc9 # v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
